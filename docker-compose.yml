services:
  postgres:
    image: postgres:16-alpine
    container_name: meus-exames-db
    restart: unless-stopped
    # Auditoria Postgres 01/09/26 (regras conn-/lock-): timeouts zerados deixavam
    # transação esquecida (ex.: $transaction do activity-sync) segurar locks e
    # bloquear autovacuum INDEFINIDAMENTE. preload habilita pg_stat_statements
    # (a extensão em si é criada com CREATE EXTENSION — ver docs/ops).
    command: >
      postgres
      -c idle_in_transaction_session_timeout=60s
      -c statement_timeout=30s
      -c lock_timeout=10s
      -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: meus_exames
      POSTGRES_PASSWORD: meus_exames_dev
      POSTGRES_DB: meus_exames
    ports:
      - "5433:5432"  # 5432 ocupado pelo projeto janocaminho; usamos 5433 no host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meus_exames -d meus_exames"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
