    - generic [ref=e306]:
      - paragraph [ref=e307]: Todas as informações contidas neste site têm a intenção de informar e educar, não pretendendo, de forma alguma, substituir as orientações de um profissional médico ou servir como recomendação para qualquer tipo de tratamento. Decisões relacionadas a tratamento de pacientes devem ser tomadas por profissionais autorizados, considerando as características de cada paciente. Se persistirem os sintomas, o médico deverá ser consultado. Procure um médico e o farmacêutico. Leia a bula. Não comercializamos, não indicamos, não receitamos, nenhum tipo de medicamento essa função cabe exclusivamente a médicos e farmacêuticos. Não consuma qualquer tipo de medicamento sem consultar seu médico. Não somos uma loja ou marketplace, ou seja, não realizamos a venda de medicamentos, apenas contribuímos para que você encontre o preço mais barato, comparando os preços de produtos farmacêuticos. Contribuímos e damos auxílio para que sua experiência seja bem-sucedida, mas a finalização da compra acontece nos sites das nossas lojas parceiras.
