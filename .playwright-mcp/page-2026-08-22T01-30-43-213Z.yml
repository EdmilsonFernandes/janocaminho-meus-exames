  - generic [ref=f3e21]:
    - generic [ref=f3e22]:
      - button "O que é o Dr. Exame?" [ref=f3e23] [cursor=pointer]
      - generic: É o app que guarda, interpreta e monitora seus exames. Você envia o laudo e a IA explica cada valor em linguagem simples, compara com a sua faixa ideal (não só a de referência), mostra a evolução entre exames e gera um relatório pra levar ao médico.
    - generic [ref=f3e28]:
      - button "Preciso pagar pra começar?" [ref=f3e29] [cursor=pointer]
      - generic: Não. Crie sua conta grátis e envie seu primeiro exame. Você assina ou compra créditos só quando precisar de mais — comece grátis, pague só pelo que usar.
    - generic [ref=f3e34]:
      - button "Como envio meu exame?" [ref=f3e35] [cursor=pointer]
      - generic: Envie o PDF do laboratório (ideal) ou uma foto do laudo. A extração lê os valores automaticamente e você confere antes de salvar. PDF com vários exames de datas diferentes? O app divide em exames separados sozinho.
    - generic [ref=f3e40]:
      - button "Como funcionam os créditos?" [ref=f3e41] [cursor=pointer]
      - generic: Enviar exames é grátis. Recursos que consomem mais processamento — como relatório inteligente e o chat com a IA — usam créditos. Você ganha créditos bônus ao começar e ao completar conquistas, e pode comprar mais via PIX a qualquer momento.
    - generic [ref=f3e46]:
      - button "O que muda com o plano mensal?" [ref=f3e47] [cursor=pointer]
      - generic: O plano mensal libera o uso dos recursos premium com cota mensal generosa — sem ficar contando crédito por crédito. Cancele quando quiser, direto no app, sem multa.
    - generic [ref=f3e52]:
      - button "Como funciona o programa de indicação?" [ref=f3e53] [cursor=pointer]
      - generic: Compartilhe seu código com amigos. Quando alguém cria a conta usando ele, vocês dois ganham créditos bônus pra usar no app.
    - generic [ref=f3e58]:
      - button "Esqueci minha senha, e agora?" [ref=f3e59] [cursor=pointer]
      - generic: Toque em "Esqueci minha senha" na tela de login e informe seu e-mail. Você recebe um link de redefinição — por segurança, o link é de uso único e expira.
    - generic [ref=f3e64]:
      - button "Posso entrar com o Google?" [ref=f3e65] [cursor=pointer]
      - generic: "Sim — no app Android e no navegador. É a mesma conta nos dois: seus exames ficam sincronizados onde você entrar."
    - generic [ref=f3e70]:
      - button "Dá pra gerenciar exames de familiares?" [ref=f3e71] [cursor=pointer]
      - generic: Dá. Cada familiar entra como dependente, com histórico e evolução próprios — e você alterna entre as pessoas no painel da família.
    - generic [ref=f3e76]:
      - button "A IA dá diagnóstico?" [ref=f3e77] [cursor=pointer]
      - generic: "Não — e isso é por design. A IA educa: compara seus valores com a faixa de referência e com a faixa ideal, contextualiza pelo seu perfil e monta perguntas pra levar ao médico. A decisão clínica é sempre do profissional."
    - generic [ref=f3e82]:
      - button "A IA pode inventar valores?" [ref=f3e83] [cursor=pointer]
      - generic: Os valores saem direto do seu laudo — a IA só explica o que já está escrito. Antes de salvar, você confere tudo o que foi extraído e corrige se precisar.
    - generic [ref=f3e88]:
      - button "Funciona sem internet?" [ref=f3e89] [cursor=pointer]
      - generic: Sim. Seus últimos exames e dados ficam disponíveis offline no app; quando a conexão volta, tudo sincroniza automaticamente.
    - generic [ref=f3e94]:
      - button "Como compartilho meus exames com meu médico?" [ref=f3e95] [cursor=pointer]
      - generic: No app, escolha o que compartilhar e indique o CRM do médico. Ele recebe acesso de leitura — exames, valores alterados e relatório — sem precisar cadastrar nada.
    - generic [ref=f3e100]:
      - button "O que o médico vê exatamente?" [ref=f3e101] [cursor=pointer]
      - generic: "Você escolhe o escopo: exames, alterados, relatório e evolução. No portal, o médico ainda recebe um brief de pré-consulta com as principais mudanças desde a última visita e as perguntas que você fez no app."
    - generic [ref=f3e106]:
      - button "Posso cancelar o compartilhamento?" [ref=f3e107] [cursor=pointer]
      - generic: Sim, a qualquer momento e com um toque. Ao revogar, o médico perde o acesso na hora.
    - generic [ref=f3e112]:
      - button "Meus dados de saúde estão seguros?" [ref=f3e113] [cursor=pointer]
      - generic: "Sim. Seguimos a LGPD: dados de identificação são criptografados, os PDFs dos exames ficam armazenados fora do banco de dados e o acesso é exclusivamente seu — e de quem você autorizar."
    - generic [ref=f3e118]:
      - button "Quem pode ver meus exames?" [ref=f3e119] [cursor=pointer]
      - generic: Só você — e os médicos que você autorizar explicitamente, com o escopo que você definir. Nada é compartilhado sem o seu ato.
    - generic [ref=f3e124]:
      - button "Como excluo meus dados?" [ref=f3e125] [cursor=pointer]
      - generic: Você pode excluir exames individualmente dentro do app ou pedir a exclusão completa da conta pelo suporte — removemos seus dados em conformidade com a LGPD.
  - generic [ref=f3e130]:
    - heading "Ainda com dúvidas?" [level=2] [ref=f3e131]
    - paragraph [ref=f3e132]: Abra um chamado no app (Suporte) ou fale com a gente por e-mail.
    - link "Falar com o suporte" [ref=f3e133] [cursor=pointer]:
      - /url: mailto:contato@janocaminho.com.br