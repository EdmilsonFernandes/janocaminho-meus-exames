            - generic [ref=f2e100]:
              - heading "O que é" [level=2] [ref=f2e101]
              - paragraph [ref=f2e102]: Com o Pix Automático, você pode pagar suas contas recorrentes, como de energia, telefone, escolas, academias, condomínios, assinaturas, seguros, entre outras, de forma automática pelo Pix.
              - generic [ref=f2e105]:
                - generic [ref=f2e106]:
                  - generic [ref=f2e107]:
                    - button "Play video" [ref=f2e111] [cursor=pointer]
                    - paragraph [ref=f2e115]:
                      - strong [ref=f2e117]: Como funciona o Pix Automático e o que ele muda no dia a dia das empresas e pessoas?
                      - text: "LiveBC #43"
                  - generic [ref=f2e118]:
                    - button "Play video" [ref=f2e122] [cursor=pointer]
                    - paragraph [ref=f2e126]:
                      - strong [ref=f2e128]: "Pix Automático, débito ou cartão de crédito: qual o melhor para sua conta?"
                      - text: "BC te Explica #154"
                  - generic [ref=f2e129]:
                    - button "Play video" [ref=f2e133] [cursor=pointer]
                    - paragraph [ref=f2e137]:
                      - strong [ref=f2e139]: Como receber pagamentos com Pix Automático?
                      - text: Como é que uma empresa pode passar a receber pagamentos por Pix Automático?
                  - generic [ref=f2e140]:
                    - button "Play video" [ref=f2e144] [cursor=pointer]
                    - paragraph [ref=f2e148]:
                      - strong [ref=f2e150]: Como funciona o Pix Automático para pagar contas?
                      - text: O Pix Automático está chegando para facilitar a sua vida!
                  - generic [ref=f2e151]:
                    - button "Play video" [ref=f2e155] [cursor=pointer]
                    - paragraph [ref=f2e159]:
                      - strong [ref=f2e161]: Conexão Pix 3ª edição.
                      - text: Confira como foi o evento em que o BC apresentou o Pix Automático com participação de empresas e especialistas do setor.
                  - generic [ref=f2e162]:
                    - button "Play video" [ref=f2e166] [cursor=pointer]
                    - paragraph [ref=f2e170]:
                      - strong [ref=f2e172]: "BC te Explica #131 - O que são o Pix automático e o agendamento recorrente?"
                      - text: Agende pagamentos e transferências com praticidade.
                - generic [ref=f2e173] [cursor=pointer]: chevron_right
              - heading "Como funciona" [level=3] [ref=f2e175]
              - paragraph [ref=f2e176]: O Pix Automático facilita a vida de quem usa, permitindo que pagamentos recorrentes sejam feitos de forma automática. O pagador precisa autorizar uma única vez a operação, sem precisar fazer um novo pagamento a cada nova cobrança. Mais praticidade e conveniência para o dia a dia.
              - list [ref=f2e177]:
                - listitem [ref=f2e178]: Empresa, que pode ser sua academia, a escola do seu filho, ou mesmo seu serviço de streaming favorito, oferece Pix Automático como forma de pagamento de seus produtos ou serviços.
                - listitem [ref=f2e179]: Pagador autoriza o pagamento das cobranças por Pix Automático e define regras, como o valor máximo de cada pagamento e a possibilidade de utilizar linha de crédito caso não possua saldo suficiente no momento da cobrança.
                - listitem [ref=f2e180]: Periodicamente, nos dias anteriores ao pagamento, a empresa envia cobrança ao banco do pagador.
                - listitem [ref=f2e181]: O banco do pagador agenda o pagamento e notifica o pagador, que pode conferir, antes do pagamento e no app da sua conta, se está tudo certo.
                - listitem [ref=f2e182]: No dia do pagamento, o banco do pagador efetiva o pagamento da cobrança de acordo com as regras definidas na autorização.
              - heading "Quais os benefícios" [level=3] [ref=f2e183]
              - generic [ref=f2e187]:
                - paragraph
                - list [ref=f2e188]:
                  - listitem [ref=f2e189]: Inovador
                  - listitem [ref=f2e190]: Prático
                  - listitem [ref=f2e191]: Fácil de ser usado (para quem vai pagar e para quem vai receber)
                  - listitem [ref=f2e192]: Barato e inclusivo (para pessoas, empresas e governos, ou seja, para todos)
                - paragraph
              - list [ref=f2e197]:
                - listitem [ref=f2e198]: "Aumento da base de clientes: mais de 160 milhões de usuários Pix"
                - listitem [ref=f2e199]: "Menor custo operacional: basta contratar um único participante do Pix"
                - listitem [ref=f2e200]: "Diversificação de formas de pagamento: clientes que não usam cartão ou boleto podem pagar com Pix"
                - listitem [ref=f2e201]: "Redução da inadimplência: a cobrança é automática"
              - list [ref=f2e206]:
                - listitem [ref=f2e207]: "Facilidade: simples de aderir"
                - listitem [ref=f2e208]: "Conveniência: pagamentos feitos na data certa, automaticamente"
                - listitem [ref=f2e209]: "Controle: gestão de autorização, pagamento e cancelamento direto no app da sua conta"
                - listitem [ref=f2e210]: "Inclusão: não é necessário possuir cartão de crédito"
                - listitem [ref=f2e211]: "Acesso ao serviço por meio de múltiplas opções: em bancos, cooperativas, instituições de pagamento, iniciadores de pagamento etc."
              - generic [ref=f2e212]:
                - strong [ref=f2e214]: É seguro!
                - generic [ref=f2e215]:
                  - img "Pix Automático Segurança" [ref=f2e217]
                  - generic [ref=f2e218]:
                    - paragraph [ref=f2e219]: A segurança é uma dos princípios fundamentais do Pix. O Banco Central trabalha continuamente para garantir que o Pix e suas funcionalidades, incluindo o Pix Automático, mantenham um elevado padrão de segurança.
                    - paragraph [ref=f2e220]:
                      - text: Se acontecer algum problema no uso do Pix Automático, você pode acionar o
                      - button "Mecanismo Especial de Devolução (MED)" [ref=f2e222] [cursor=pointer]
