            - generic [ref=f3e295]:
              - generic [ref=f3e296]:
                - separator [ref=f3e297]
                - generic [ref=f3e300]:
                  - generic [ref=f3e301]: O Banco Central lança em 1º de dezembro de 2025 hoje o BC Protege+, serviço gratuito que permite que pessoas e empresas comuniquem ao sistema financeiro que não desejam a abertura de conta ou sua inclusão como titular ou representante em contas. O evento oficial acontece no auditório do Edifício-Sede do Banco Central em Brasília, com transmissão ao vivo pelo YouTube do BC, às 14h30.
                  - generic [ref=f3e303]:
                    - text: Clique
                    - link "aqui" [ref=f3e304] [cursor=pointer]:
                      - /url: https://www.youtube.com/live/pp6bDjJkUek
                    - text: para assistir à transmissão.
                  - generic [ref=f3e306]: A proteção se aplica a contas de depósitos à vista, contas de depósitos de poupança e contas de pagamento pré-pagas, bem como a inclusão de titular ou representante nessas contas. Ela vale para todas as novas aberturas de contas, inclusive na mesma instituição ou conglomerado que o CPF ou o CNPJ já tenha conta.
                  - generic [ref=f3e308]:
                    - text: Vale destacar que o BC Protege+ não substitui outras medidas de segurança dado que o sistema é uma camada extra de proteção. As instituições financeiras devem continuar verificando a identidade dos clientes e a autenticidade das informações, inclusive para atender ao disposto na
                    - link "Resolução Conjunta nº 6" [ref=f3e309] [cursor=pointer]:
                      - /url: /estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20Conjunta&numero=6
                    - text: ", de 23/5/2023."
                  - generic [ref=f3e311]: A iniciativa faz parte de um conjunto de ações que vêm sendo discutidas entre vários órgãos públicos e participantes do sistema financeiro, sendo que o principal objetivo da ferramenta é reforçar a segurança contra fraudes com uso de identidade falsa no Sistema Financeiro Nacional.
                  - generic [ref=f3e313]:
                    - generic [ref=f3e314]: "\"O BC Protege+ vai ao encontro de uma demanda da sociedade e reforça o compromisso do BC em garantir mais segurança e transparência para os cidadãos em suas interações com o sistema financeiro\", destaca Maria Clara Roriz Haag, do Departamento de Atendimento Institucional (Deati) do BC."
                    - strong [ref=f3e317]: Acesso pelo cidadão
                    - generic [ref=f3e318]: Qualquer pessoa, física ou jurídica, pode ativar a proteção. Para acessar o serviço, é preciso ter conta gov.br nível prata ou ouro com a verificação em duas etapas habilitada.
                    - generic [ref=f3e319]:
                      - text: O BC Protege+ estará disponível no site do BC, dentro da área logada do Meu BC no site do Banco Central (
                      - link "www.bcb.gov.br/meubc" [ref=f3e320] [cursor=pointer]:
                        - /url: /meubc
                      - text: "), seguindo: “Serviços > Cidadão >"
                      - link "Meu BC" [ref=f3e321] [cursor=pointer]:
                        - /url: /meubc
                      - text: ”. Dentro do sistema, é possível ativar ou desativar a proteção a qualquer momento.
                    - generic [ref=f3e323]: “É importante destacar que a ativação da proteção não é automática. Os cidadãos, que desejarem ativar o serviço, deverão acessar o BC Protege+ e fazer essa opção. A jornada é simples e intuitiva e o serviço é on-line, portanto, a ativação ou a desativação tem efeito imediato no sistema”, explica Haag.
                    - strong [ref=f3e326]: Como funciona
                    - generic [ref=f3e327]: A opção registrada pelo cidadão no BC Protege+ fica marcada no banco de dados e, antes da abertura da conta ou da inclusão de titular ou representante em contas, as instituições financeiras autorizadas a funcionar pelo BC são obrigadas consultar o sistema para saber se a proteção está ativada ou desativada.
                    - generic [ref=f3e329]: As instituições financeiras devem tratar os dados recebidos exclusivamente para as finalidades previstas, garantindo a segurança, o processamento e a eliminação dos dados pessoais conforme a legislação vigente.
                    - generic [ref=f3e331]: "Se a proteção estiver ativada:"
                    - list [ref=f3e333]:
                      - listitem [ref=f3e334]: a instituição financeira não pode abrir a conta nem incluir o correntista como titular ou representante numa conta.
                      - listitem [ref=f3e335]: a instituição financeira deve avisar o cidadão que a proteção está ativada.
                      - listitem [ref=f3e336]: O cidadão precisa desativar o serviço, se quiser seguir com a contratação.
                    - generic [ref=f3e338]: Também é importante destacar que o cidadão pode visualizar quais instituições financeiras consultaram seu CPF ou CNPJ e o motivo da consulta (abertura de conta ou inclusão como titular/representante). Dentro do sistema, basta o cidadão acessar a área “Histórico de Consultas”.
                    - strong [ref=f3e341]: Passo a passo para usar o BC Protege+
                    - strong [ref=f3e344]: Como ativo a proteção para o meu CPF (pessoa física)?
                    - list [ref=f3e346]:
                      - listitem [ref=f3e347]: "Acesse a área logada do Meu BC no site do Banco Central em: Serviços > Cidadão > Meu BC > BC Protege+."
                      - listitem [ref=f3e348]: Entre com sua conta gov.br prata ou ouro com verificação em duas etapas.
                      - listitem [ref=f3e349]: Clique em BC Protege+ no menu ou no card inicial.
                      - listitem [ref=f3e350]: Na tela principal, escolha ativar a proteção.
                    - strong [ref=f3e352]: Como desativo a proteção para o meu CPF (pessoa física)?
                    - list [ref=f3e355]:
                      - listitem [ref=f3e356]: "Acesse a área logada do Meu BC no site do Banco Central em: Serviços > Cidadão > Meu BC > BC Protege+."
                      - listitem [ref=f3e357]: Entre com sua conta gov.br prata ou ouro com verificação em duas etapas.
                      - listitem [ref=f3e358]: Clique em BC Protege+ no menu ou no card inicial.
                      - listitem [ref=f3e359]: Na tela principal, escolha desativar a proteção.
                      - listitem [ref=f3e360]: Escolha quanto tempo deseja manter a proteção desativada. Você pode desativar por tempo indeterminado ou escolher uma data para a proteção ser reativada automaticamente.
                    - strong [ref=f3e363]: Como ativo ou desativo a proteção para um CNPJ (pessoa jurídica)?
                    - list [ref=f3e366]:
                      - listitem [ref=f3e367]: "O sócio ou o representante ou o colaborador devidamente cadastrado no módulo de empresas da plataforma Gov.br deve acessar a área logada do Meu BC no site do Banco Central em: Serviços > Cidadão > Meu BC > BC Protege+."
                      - listitem [ref=f3e368]: Entre com sua Conta gov.br prata ou ouro com verificação em duas etapas.
                      - listitem [ref=f3e369]: Clique em BC Protege+ no menu ou no card inicial.
                      - listitem [ref=f3e370]: Escolha a empresa em “Selecionar dados do titular” na tela principal.
                      - listitem [ref=f3e371]: Em seguida, escolha ativar ou desativar a proteção. Se a empresa quiser abrir uma conta, todos os titulares e representantes precisam estar com seus CPFs com a proteção desativada.
