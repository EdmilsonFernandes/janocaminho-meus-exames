            - generic [ref=f3e266]:
              - heading "BC lança serviço contra fraudes com uso de identidade falsa no Sistema Financeiro Nacional. Saiba como vai funcionar o BC Protege+" [level=1] [ref=f3e267]
              - paragraph [ref=f3e268]: A proteção abrange a abertura de conta corrente, poupança e conta de pagamento pré-paga e a inclusão como titular ou representante nessas contas. Serviço estará disponível a partir desta segunda-feira (1°/12).
              - generic [ref=f3e269]:
                - generic [ref=f3e270]:
                  - generic [ref=f3e271]: Publicado 01/12/2025 às 07:00
                  - generic [ref=f3e272]: Atualizado 11/12 às 09:31
                - generic [ref=f3e274]:
