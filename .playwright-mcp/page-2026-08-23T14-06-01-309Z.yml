            - generic [ref=f3e382]:
              - heading "O que é" [level=2] [ref=f3e383]
              - paragraph [ref=f3e384]: Com o Pix Automático, você pode pagar suas contas recorrentes, como de energia, telefone, escolas, academias, condomínios, assinaturas, seguros, entre outras, de forma automática pelo Pix.
              - generic [ref=f3e387]:
                - generic [ref=f3e388]:
                  - generic [ref=f3e389]:
                    - button "Play video" [ref=f3e393] [cursor=pointer]
                    - paragraph [ref=f3e397]:
                      - strong [ref=f3e399]: Como funciona o Pix Automático e o que ele muda no dia a dia das empresas e pessoas?
                      - text: "LiveBC #43"
                  - generic [ref=f3e400]:
                    - button "Play video" [ref=f3e404] [cursor=pointer]
                    - paragraph [ref=f3e408]:
                      - strong [ref=f3e410]: "Pix Automático, débito ou cartão de crédito: qual o melhor para sua conta?"
                      - text: "BC te Explica #154"
                  - generic [ref=f3e411]:
                    - button "Play video" [ref=f3e415] [cursor=pointer]
                    - paragraph [ref=f3e419]:
                      - strong [ref=f3e421]: Como receber pagamentos com Pix Automático?
                      - text: Como é que uma empresa pode passar a receber pagamentos por Pix Automático?
                  - generic [ref=f3e422]:
                    - button "Play video" [ref=f3e426] [cursor=pointer]
                    - paragraph [ref=f3e430]:
                      - strong [ref=f3e432]: Como funciona o Pix Automático para pagar contas?
                      - text: O Pix Automático está chegando para facilitar a sua vida!
                  - generic [ref=f3e433]:
                    - button "Play video" [ref=f3e437] [cursor=pointer]
                    - paragraph [ref=f3e441]:
                      - strong [ref=f3e443]: Conexão Pix 3ª edição.
                      - text: Confira como foi o evento em que o BC apresentou o Pix Automático com participação de empresas e especialistas do setor.
                  - generic [ref=f3e444]:
                    - button "Play video" [ref=f3e448] [cursor=pointer]
                    - paragraph [ref=f3e452]:
                      - strong [ref=f3e454]: "BC te Explica #131 - O que são o Pix automático e o agendamento recorrente?"
                      - text: Agende pagamentos e transferências com praticidade.
                - generic [ref=f3e455] [cursor=pointer]: chevron_right
              - heading "Como funciona" [level=3] [ref=f3e457]
              - paragraph [ref=f3e458]: O Pix Automático facilita a vida de quem usa, permitindo que pagamentos recorrentes sejam feitos de forma automática. O pagador precisa autorizar uma única vez a operação, sem precisar fazer um novo pagamento a cada nova cobrança. Mais praticidade e conveniência para o dia a dia.
              - list [ref=f3e459]:
                - listitem [ref=f3e460]: Empresa, que pode ser sua academia, a escola do seu filho, ou mesmo seu serviço de streaming favorito, oferece Pix Automático como forma de pagamento de seus produtos ou serviços.
                - listitem [ref=f3e461]: Pagador autoriza o pagamento das cobranças por Pix Automático e define regras, como o valor máximo de cada pagamento e a possibilidade de utilizar linha de crédito caso não possua saldo suficiente no momento da cobrança.
                - listitem [ref=f3e462]: Periodicamente, nos dias anteriores ao pagamento, a empresa envia cobrança ao banco do pagador.
                - listitem [ref=f3e463]: O banco do pagador agenda o pagamento e notifica o pagador, que pode conferir, antes do pagamento e no app da sua conta, se está tudo certo.
                - listitem [ref=f3e464]: No dia do pagamento, o banco do pagador efetiva o pagamento da cobrança de acordo com as regras definidas na autorização.
              - heading "Quais os benefícios" [level=3] [ref=f3e465]
              - generic [ref=f3e469]:
                - paragraph
                - list [ref=f3e470]:
                  - listitem [ref=f3e471]: Inovador
                  - listitem [ref=f3e472]: Prático
                  - listitem [ref=f3e473]: Fácil de ser usado (para quem vai pagar e para quem vai receber)
                  - listitem [ref=f3e474]: Barato e inclusivo (para pessoas, empresas e governos, ou seja, para todos)
                - paragraph
              - list [ref=f3e479]:
                - listitem [ref=f3e480]: "Aumento da base de clientes: mais de 160 milhões de usuários Pix"
                - listitem [ref=f3e481]: "Menor custo operacional: basta contratar um único participante do Pix"
                - listitem [ref=f3e482]: "Diversificação de formas de pagamento: clientes que não usam cartão ou boleto podem pagar com Pix"
                - listitem [ref=f3e483]: "Redução da inadimplência: a cobrança é automática"
              - list [ref=f3e488]:
                - listitem [ref=f3e489]: "Facilidade: simples de aderir"
                - listitem [ref=f3e490]: "Conveniência: pagamentos feitos na data certa, automaticamente"
                - listitem [ref=f3e491]: "Controle: gestão de autorização, pagamento e cancelamento direto no app da sua conta"
                - listitem [ref=f3e492]: "Inclusão: não é necessário possuir cartão de crédito"
                - listitem [ref=f3e493]: "Acesso ao serviço por meio de múltiplas opções: em bancos, cooperativas, instituições de pagamento, iniciadores de pagamento etc."
              - generic [ref=f3e494]:
                - strong [ref=f3e496]: É seguro!
                - generic [ref=f3e497]:
                  - img "Pix Automático Segurança" [ref=f3e499]
                  - generic [ref=f3e500]:
                    - paragraph [ref=f3e501]: A segurança é uma dos princípios fundamentais do Pix. O Banco Central trabalha continuamente para garantir que o Pix e suas funcionalidades, incluindo o Pix Automático, mantenham um elevado padrão de segurança.
                    - paragraph [ref=f3e502]:
                      - text: Se acontecer algum problema no uso do Pix Automático, você pode acionar o
                      - button "Mecanismo Especial de Devolução (MED)" [ref=f3e504] [cursor=pointer]
                      - text: através do banco onde tem conta.
