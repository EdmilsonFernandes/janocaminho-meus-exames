                    - paragraph [ref=e541]: Do you accept health insurance?
                  - generic:
                    - paragraph [ref=e542]: Marek Health does not communicate with health insurance companies for any of our services; even though the overall health of our clients is tremendously enhanced and they experience a better quality of life. Many health insurance providers don’t see it this way and consider our services elective.
                    - paragraph [ref=e543]: Many customers have had success using FSA or HSA means of payment. Marek Health can provide copies of invoices and lab requisitions as needed. Because we are direct pay, and do not seek reimbursement from insurance providers, we cannot provide procedure codes (CPT) or diagnostic codes (ICD-10).
                    - paragraph [ref=e544]: Promotion details and disclaimers
                    - paragraph [ref=e545]: Discount and promotion codes are one-time use only. Not valid on prior purchases. Offer may not be combined with any other sale, promotion, or discount code. Void where prohibited, taxed, or otherwise restricted. Customers are limited to one discount or promotion code in their lifetime. Promotions have no cash value. Marek Health has the right to modify any promotion at any time. Other restrictions may apply. Offers only apply to the United States unless otherwise noted.
                - generic [ref=e546]:
                  - generic [ref=e547] [cursor=pointer]:
                    - img "Toggle Icon" [ref=e549]
                    - paragraph [ref=e550]: What is Marek Health?
                  - generic:
                    - paragraph [ref=e551]: Marek is a telehealth platform built on streamlining health optimization. We use preventative medicine and evidence-based treatment plans to get our clients the results they want.
                    - paragraph [ref=e552]: We’re not your typical telehealth service though. While we have an extensive catalog of prescription medications, we’re not here to write you a script and end the relationship. Most other companies would just diagnose and set you up with a monthly subscription plan without giving it a second thought.
                    - paragraph [ref=e553]: But we don’t see health that way.
                    - paragraph [ref=e554]: We know our bodies vary from person to person consisting of countless variables, which is why we take a comprehensive approach by evaluating your health as a whole.
                    - paragraph [ref=e555]: What works for you won’t work for the next person. Hell, what works for you now may not work for you 3 months in the future. That’s why we don’t offer any set subscription plans and you can cancel whenever you want.
                    - paragraph [ref=e556]: Our main focus is on the client, not the prescription.
                    - paragraph [ref=e557]: Marek’s job is to connect clients interested in human optimization with pragmatic healthcare professionals who are dedicated to peak performance. Once you’ve been paired with one of our partnered physicians, the aim is to check off as many health goals as safely as possible in between check-ins.
                    - paragraph [ref=e558]: We work flexibly to fit your needs as a client because with just a little more organizational work on our end, the overall quality of life is enhanced and your results are that much better.
                    - paragraph [ref=e559]: "Note: Marek Health is not a healthcare clinic. We do not administer healthcare, nor do we prescribe treatments or medications. Instead, Marek Health is a platform that connects clients with highly specialized healthcare providers for their healthcare needs."
