          - heading "A word before" [level=2] [ref=f2e236]
          - paragraph [ref=f2e237]: I actually adore tables. They’re my first love as a frontend developer. Back in the day (before css really), I didn’t use tables to accommodate data, but I abused its unique, grid-like qualities as a layout-mechanism. Many of you will remember tables-in-tables-in-tables, just to position a rounded corner on an element.
          - paragraph [ref=f2e238]: "Nowadays, tables are used for what they’re meant for: present data in a logical fashion."
        - separator [ref=f2e239]
        - generic [ref=f2e245]:
          - heading "About the design" [level=2] [ref=f2e246]
          - paragraph [ref=f2e247]: A data-table is basically a grid with rows that contain data related to a single entity¹. Headers describe the content displayed in columns.
          - paragraph [ref=f2e248]: In order to gain insight from a table, users must be able to easily compare its values. A data-table is therefore by default not meant for small screens; there is simply not enough room to horizontally fit meaningful headers onscreen.
          - paragraph [ref=f2e249]: An elegant way to compare values in a mobile table is to transform rows into individual cards and stack their column-data within (with corresponding descriptive headers).
        - separator [ref=f2e250]
