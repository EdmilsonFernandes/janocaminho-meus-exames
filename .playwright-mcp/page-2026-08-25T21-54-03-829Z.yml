            - paragraph [ref=f2e211]: Data tables are a great way to organise structured data, but they are really only meant for screens with lot’s of (horizontal) space. This document describes a solution where table rows are displayed as individual cards on mobile devices, featuring dynamic headers using a little javascript.
          - figure "Table rows stacked as individual cards on mobile" [ref=f2e215]:
            - button "Press enter or click to view image in full size" [ref=f2e216]
