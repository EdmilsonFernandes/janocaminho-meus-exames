          - paragraph [ref=f2e363]: Since every table header is prepended to each column, we need to hide them for larger screens. This can be done using javascript, but i thought it is easier (for readability purposes) to hide them using css. Each paragraph is therefore given a class ‘.faux-th’ that we can style to our liking.
