            - generic [ref=f3e379]:
              - heading "O que é" [level=2] [ref=f3e380]
              - paragraph [ref=f3e381]: Com o Pix Automático, você pode pagar suas contas recorrentes, como de energia, telefone, escolas, academias, condomínios, assinaturas, seguros, entre outras, de forma automática pelo Pix.
              - generic [ref=f3e384]:
                - generic [ref=f3e385]:
                  - generic [ref=f3e386]:
                    - button "Play video" [ref=f3e390] [cursor=pointer]
                    - paragraph [ref=f3e394]:
                      - strong [ref=f3e396]: Como funciona o Pix Automático e o que ele muda no dia a dia das empresas e pessoas?
                      - text: "LiveBC #43"
                  - generic [ref=f3e397]:
                    - button "Play video" [ref=f3e401] [cursor=pointer]
                    - paragraph [ref=f3e405]:
                      - strong [ref=f3e407]: "Pix Automático, débito ou cartão de crédito: qual o melhor para sua conta?"
                      - text: "BC te Explica #154"
                  - generic [ref=f3e408]:
                    - button "Play video" [ref=f3e412] [cursor=pointer]
                    - paragraph [ref=f3e416]:
                      - strong [ref=f3e418]: Como receber pagamentos com Pix Automático?
                      - text: Como é que uma empresa pode passar a receber pagamentos por Pix Automático?
                  - generic [ref=f3e419]:
                    - button "Play video" [ref=f3e423] [cursor=pointer]
                    - paragraph [ref=f3e427]:
                      - strong [ref=f3e429]: Como funciona o Pix Automático para pagar contas?
                      - text: O Pix Automático está chegando para facilitar a sua vida!
                  - generic [ref=f3e430]:
                    - button "Play video" [ref=f3e434] [cursor=pointer]
                    - paragraph [ref=f3e438]:
                      - strong [ref=f3e440]: Conexão Pix 3ª edição.
                      - text: Confira como foi o evento em que o BC apresentou o Pix Automático com participação de empresas e especialistas do setor.
                  - generic [ref=f3e441]:
                    - button "Play video" [ref=f3e445] [cursor=pointer]
                    - paragraph [ref=f3e449]:
                      - strong [ref=f3e451]: "BC te Explica #131 - O que são o Pix automático e o agendamento recorrente?"
                      - text: Agende pagamentos e transferências com praticidade.
                - generic [ref=f3e452] [cursor=pointer]: chevron_right
              - heading "Como funciona" [level=3] [ref=f3e454]
              - paragraph [ref=f3e455]: O Pix Automático facilita a vida de quem usa, permitindo que pagamentos recorrentes sejam feitos de forma automática. O pagador precisa autorizar uma única vez a operação, sem precisar fazer um novo pagamento a cada nova cobrança. Mais praticidade e conveniência para o dia a dia.
              - list [ref=f3e456]:
                - listitem [ref=f3e457]: Empresa, que pode ser sua academia, a escola do seu filho, ou mesmo seu serviço de streaming favorito, oferece Pix Automático como forma de pagamento de seus produtos ou serviços.
                - listitem [ref=f3e458]: Pagador autoriza o pagamento das cobranças por Pix Automático e define regras, como o valor máximo de cada pagamento e a possibilidade de utilizar linha de crédito caso não possua saldo suficiente no momento da cobrança.
                - listitem [ref=f3e459]: Periodicamente, nos dias anteriores ao pagamento, a empresa envia cobrança ao banco do pagador.
                - listitem [ref=f3e460]: O banco do pagador agenda o pagamento e notifica o pagador, que pode conferir, antes do pagamento e no app da sua conta, se está tudo certo.
                - listitem [ref=f3e461]: No dia do pagamento, o banco do pagador efetiva o pagamento da cobrança de acordo com as regras definidas na autorização.
              - heading "Quais os benefícios" [level=3] [ref=f3e462]
              - generic [ref=f3e466]:
                - paragraph
                - list [ref=f3e467]:
                  - listitem [ref=f3e468]: Inovador
                  - listitem [ref=f3e469]: Prático
                  - listitem [ref=f3e470]: Fácil de ser usado (para quem vai pagar e para quem vai receber)
                  - listitem [ref=f3e471]: Barato e inclusivo (para pessoas, empresas e governos, ou seja, para todos)
                - paragraph
              - list [ref=f3e476]:
                - listitem [ref=f3e477]: "Aumento da base de clientes: mais de 160 milhões de usuários Pix"
                - listitem [ref=f3e478]: "Menor custo operacional: basta contratar um único participante do Pix"
                - listitem [ref=f3e479]: "Diversificação de formas de pagamento: clientes que não usam cartão ou boleto podem pagar com Pix"
                - listitem [ref=f3e480]: "Redução da inadimplência: a cobrança é automática"
              - list [ref=f3e485]:
                - listitem [ref=f3e486]: "Facilidade: simples de aderir"
                - listitem [ref=f3e487]: "Conveniência: pagamentos feitos na data certa, automaticamente"
                - listitem [ref=f3e488]: "Controle: gestão de autorização, pagamento e cancelamento direto no app da sua conta"
                - listitem [ref=f3e489]: "Inclusão: não é necessário possuir cartão de crédito"
                - listitem [ref=f3e490]: "Acesso ao serviço por meio de múltiplas opções: em bancos, cooperativas, instituições de pagamento, iniciadores de pagamento etc."
              - generic [ref=f3e491]:
                - strong [ref=f3e493]: É seguro!
                - generic [ref=f3e494]:
                  - img "Pix Automático Segurança" [ref=f3e496]
                  - generic [ref=f3e497]:
                    - paragraph [ref=f3e498]: A segurança é uma dos princípios fundamentais do Pix. O Banco Central trabalha continuamente para garantir que o Pix e suas funcionalidades, incluindo o Pix Automático, mantenham um elevado padrão de segurança.
                    - paragraph [ref=f3e499]:
                      - text: Se acontecer algum problema no uso do Pix Automático, você pode acionar o
                      - button "Mecanismo Especial de Devolução (MED)" [ref=f3e501] [cursor=pointer]
