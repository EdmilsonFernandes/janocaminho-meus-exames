        - paragraph [ref=f1e1726]: "*Function's $365 first-year membership includes fully prepaid access to 160+ lab tests, with a leading nationwide provider, in all states except New York and New Jersey. Unless otherwise indicated all promotions apply to the first year of a Function Health membership and do not apply to Add-On Tests or Function Scans, other than the member pricing available for select MRI scans."
        - paragraph [ref=f1e1727]: Function Health is a healthcare technology company and not a laboratory or medical provider. All laboratory and medical services are provided by independent third parties. These laboratory and medical service providers set their own pricing. Although Function Health may facilitate easy access to certain laboratory and medical service providers on your behalf, Function Health does not recommend or refer you to any healthcare providers, and you are free to choose any healthcare provider and to continue to use Function Health's services. Function Health does not offer medical advice, laboratory services, a diagnosis, medical treatment, or any form of medical opinion, through our services or otherwise. Function Health's services are not a substitute for medical care, medical advice, and/or a detailed discussion with your primary care physician or other licensed provider. If you have any questions regarding any laboratory results or other information that you access through Function Health, we recommend that you discuss those questions with a primary care physician or other licensed provider. All material, information, data, and content that Function Health provides is strictly for general information purposes. Function Health's membership pricing includes technology and service fees charged by Function Health, as well as access to limited prepaid laboratory and other services provided by third parties, and paid to such third parties on your behalf. Itemization of all fees is available upon request. Certain items and services require additional payment that are not included in standard membership pricing. For other important information regarding the services provided by Function Health, please see terms of service.
        - paragraph [ref=f1e1728]: Function Health does not provide tax, legal, or financial advice. Please be aware that HSA/FSA eligibility, contribution amounts, rollover provisions, and other key features may change annually and differ between plans. We recommend consulting your plan administrator, HR department, or a qualified tax or financial advisor to understand how these accounts apply to your specific situation. We are not responsible for any errors or changes in regulations that may affect your FSA or HSA benefits. Ezra provides imaging services for screening and informational purposes only. Services are subject to eligibility requirements and may not be appropriate for all individuals. All scans are reviewed by board-certified radiologists. Results do not constitute a medical diagnosis, treatment plan, or substitute for care from your physician. You should consult your personal healthcare provider regarding any medical concerns or before making healthcare decisions. By providing your phone number, you agree to receive text messages from Function Health. Message and data rates may apply. Message frequency varies. Long live humans.
        - paragraph [ref=f1e1729]: © 2026 Function Health. All rights reserved. 100 Healthy Years.