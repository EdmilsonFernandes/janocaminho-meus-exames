          - paragraph [ref=e122]: Welcome to the Verification API documentation
          - paragraph [ref=e123]: Provide an exceptional experience to your customers with agile, secure, and low-friction registration verification. Using cutting-edge technology, we identify CPF or CNPJ registration data in real-time, optimizing digital onboarding processes, account opening, and customer registration on websites and apps.
          - heading "Features" [level=2] [ref=e124]
          - paragraph [ref=e125]:
            - strong [ref=e126]: "• Registration Verification:"
            - text: allows you to confirm the consistency of a registration through matching links between registration data and CPF/CNPJ.
            - img "img.png" [ref=e127]
          - paragraph [ref=e128]:
            - strong [ref=e129]: "What we verify:"
          - paragraph [ref=e130]:
            - strong [ref=e131]: "Natural Person:"
          - list [ref=e132]:
            - listitem [ref=e133]: CPF Registration Status,
            - listitem [ref=e134]: PEP Flag,
            - listitem [ref=e135]: Full name
            - listitem [ref=e136]: Date of birth
            - listitem [ref=e137]: Phone
            - listitem [ref=e138]: Mother's name
            - listitem [ref=e139]: Address
            - listitem [ref=e140]: Email
          - paragraph [ref=e141]:
            - strong [ref=e142]: "Legal Entity:"
          - list [ref=e143]:
            - listitem [ref=e144]: CNPJ Registration Status
            - listitem [ref=e145]: Social Name | Fantasy name
            - listitem [ref=e146]: Opening date
            - listitem [ref=e147]: Phone
            - listitem [ref=e148]: Email
            - listitem [ref=e149]: Address
            - listitem [ref=e150]: CPF + Full name of partners
            - listitem [ref=e151]: Primary and secondary CNAE
          - heading "Technical Documentation" [level=2] [ref=e152]
          - heading "Assumptions" [level=3] [ref=e153]
          - paragraph [ref=e154]: "To get started, you must request the creation of an account from the responsible sales consultant. The following steps are necessary to generate the JWT Bearer Token to access the APIs, such as:"
          - list [ref=e155]:
            - listitem [ref=e156]: Have a user and password registered with Serasa Experian.
            - listitem [ref=e157]: Update the password before first use.
          - blockquote [ref=e158]:
            - paragraph [ref=e159]:
              - strong [ref=e160]: The login and password are provided by your Sales Consultant.
            - paragraph [ref=e161]:
              - text: "If you have any questions, contact your consultant or send your query to the email:"
              - link "CSIDF@br.experian.com" [ref=e162] [cursor=pointer]:
                - /url: /api/data-verification-for-pf-pj/mailtocsidfbrexperiancom
          - heading "Token Generation" [level=3] [ref=e163]
          - paragraph [ref=e164]: To access any endpoint of this application, OAuth 2.0 authentication is required, obtaining an authentication token generated by Serasa Experian Brasil's IAM, with login and password.
          - paragraph [ref=e165]: "Make an HTTP POST call sending the user and password in the Basic Authentication standard. Basic Authentication is a common authentication system of the HTTP protocol. The service consumer sends the user and password in the call header, in base64 format and with the Authorization key. Example:"
          - paragraph [ref=e166]:
            - code [ref=e167]: "Authorization: Basic {credentials in base 64 in the format user:password}"
          - paragraph [ref=e168]: "Client authentication:"
          - list [ref=e169]:
            - listitem [ref=e170]:
              - text: To generate a
              - insertion [ref=e171]: homologation
              - text: "token, use the URL:"
              - link "https://uat-api.serasaexperian.com.br/security/iam/v1/client-identities/login" [ref=e172] [cursor=pointer]:
                - /url: https://uat-api.serasaexperian.com.br/security/iam/v1/client-identities/login
            - listitem [ref=e173]:
              - text: To generate a
              - insertion [ref=e174]: production
              - text: "token, use the URL:"
              - link "https://api.serasaexperian.com.br/security/iam/v1/client-identities/login" [ref=e175] [cursor=pointer]:
                - /url: https://api.serasaexperian.com.br/security/iam/v1/client-identities/login
          - code [ref=e177]: "curl --location --request POST 'https://uat-api.serasaexperian.com.br/security/iam/v1/client-identities/login' --header 'Content-Type: application/json' --header 'Authorization: Basic {credencial em base 64 no formato clientId:clientSecret}'"
          - paragraph [ref=e178]: After the call, a bearer token will be returned, which has a duration of 1 hour. It is not necessary to generate a token for each request, only to generate a new one when the token's duration expires.
          - paragraph [ref=e179]: "Expected response, status code 201:"
          - code [ref=e181]: "{ \"accessToken\": \"eyJhbGciOiJSUzUxMiJ9.eyJqdGkiOiJhMjQwZjBmYy0wMDk3LTQ3ZTktODFlMC1iZjZkMzJjNDYzNjYiLCJpYX...\", \"tokenType\": \"Bearer\", \"expiresIn\": \"1696272765\", \"scope\": [ \"READ\", \"WRITE\" ] }"
          - paragraph [ref=e182]:
            - text: Now, with this token, you can make the call to the registration verification application. This token has an expiration date and time,
            - emphasis [ref=e183]: "\"expiresIn\": \"1696272765\""
            - text: ", and can be used in multiple calls without the need to obtain it again."
          - heading "Data Verification - Natural Person" [level=2] [ref=e184]
          - paragraph [ref=e185]:
            - strong [ref=e186]: Endpoint
            - emphasis [ref=e187]:
              - strong [ref=e188]: /people
          - paragraph [ref=e189]: "See below for a sample call:"
          - code [ref=e191]: "curl --location 'https://uat-api.serasaexperian.com.br/id-fraud/verify-id/v1/people --header 'Content-Type: application/json' \\</span></span> --header 'Authorization: Bearer eyJhbGciOiJSUzUxMiJ9.eyJqdGkiOiJhMjQwZjBmYy0wMDk3LTQ3ZTktODFlMC1iZjZkMzJjNDYzNjYiLCJpYX...' \\</span></span> --data-raw '"
          - paragraph [ref=e192]: "Request body:"
          - code [ref=e194]: "{ \"person\": { \"document\": \"28281838230\", \"name\": \"ITAMAR DOS SANTOS\", \"socialName\": \"MARIA SILVA\", \"birthDate\": \"1975-03-12\", \"motherName\": \"LUCIA HELENA ALVES CAETANO\", \"email\": \"twohique@hotmail.com\", \"address\": { \"street\": \"AV SANTANA\", \"number\": \"2930\", \"city\": \"SANTANA\", \"state\": \"AP\", \"zipCode\": \"68925076\" }, \"phone\": { \"areaCode\": \"55\", \"number\": \"997247341\" } }, \"scoreParameters\": [ \"VERIFY\" ] }"
