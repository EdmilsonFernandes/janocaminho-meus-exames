          - heading "Support" [level=2] [ref=e1527]
          - blockquote [ref=e1528]:
            - paragraph [ref=e1529]:
              - strong [ref=e1530]: For more questions, do not hesitate to contact us.
            - paragraph [ref=e1531]:
              - link "onboardingidf@br.experian.com" [ref=e1532] [cursor=pointer]:
                - /url: /api/data-verification-for-pf-pj/mailtoonboardingidfbrexperiancom
          - heading "FAQs" [level=2] [ref=e1533]
          - paragraph [ref=e1534]: "Frequently Asked Questions:"
          - list [ref=e1535]:
            - listitem [ref=e1536]:
              - paragraph [ref=e1537]:
                - strong [ref=e1538]: What are Anti-Fraud Scores?
              - list [ref=e1539]:
                - listitem [ref=e1540]: These are statistical models that result in a score ranging from 0 (zero) to 1,000 (one thousand) indicating the probability of a CPF or CNPJ presenting a fraud risk - the higher the score, the lower the risk.
            - listitem [ref=e1541]:
              - paragraph [ref=e1542]:
                - strong [ref=e1543]: What is the purpose of the scores?
              - list [ref=e1544]:
                - listitem [ref=e1545]: To support you in risk classification and to guide decision-making within the analysis flow more securely and quickly. It is important to note that the final decision, whether to approve or reject the analysis, is the responsibility of the institution contracting the solution – Serasa Experian does not interfere in this process.
            - listitem [ref=e1546]:
              - paragraph [ref=e1547]:
                - strong [ref=e1548]: What score value should I accept as safe?
              - list [ref=e1549]:
                - listitem [ref=e1550]: Each operation is subject to a certain risk, so it is necessary to understand the adherence of our solution to your business through a backtest.
            - listitem [ref=e1551]:
              - paragraph [ref=e1552]:
                - strong [ref=e1553]: How do I obtain my test and production login and password?
              - list [ref=e1554]:
                - listitem [ref=e1555]: Request it from your commercial contact at Serasa Experian or contact our Customer Relationship Center at 3003-7372.
            - listitem [ref=e1556]:
              - paragraph [ref=e1557]:
                - strong [ref=e1558]: What is the purpose of the UAT environment?
              - list [ref=e1559]:
                - listitem [ref=e1560]: The homologation environment aims to test the integration with the Serasa Experian product. Once approved, this connection expires, and the Production environment is expected to be used.
            - listitem [ref=e1561]:
              - paragraph [ref=e1562]:
                - strong [ref=e1563]: Is there a charge for queries made in the test environment?
              - list [ref=e1564]:
                - listitem [ref=e1565]: There is no charge. However, the queries are made on fictitious documents (CPFs) provided by Serasa Experian.
            - listitem [ref=e1566]:
              - paragraph [ref=e1567]:
                - strong [ref=e1568]: Are all CPF documents available for validation in the test environment?
              - list [ref=e1569]:
                - listitem [ref=e1570]: No. The test data is limited to a very small number of fictitious CPFs.
            - listitem [ref=e1571]:
              - paragraph [ref=e1572]:
                - strong [ref=e1573]: How can I obtain documents for queries in the test environment?
              - list [ref=e1574]:
                - listitem [ref=e1575]:
                  - text: Request them from
                  - link "onboardingidf@br.experian.com" [ref=e1576] [cursor=pointer]:
                    - /url: /api/data-verification-for-pf-pj/mailtoonboardingidfbrexperiancom
            - listitem [ref=e1577]:
              - paragraph [ref=e1578]:
                - strong [ref=e1579]: Does Serasa Experian provide code examples for application development?
              - list [ref=e1580]:
                - listitem [ref=e1581]: No.
            - listitem [ref=e1582]:
              - paragraph [ref=e1583]:
                - strong [ref=e1584]: Is there a cost for project support/clarification of integration doubts?
              - list [ref=e1585]:
                - listitem [ref=e1586]: There is no additional cost to the product contract.
            - listitem [ref=e1587]:
              - paragraph [ref=e1588]:
                - strong [ref=e1589]: Is it necessary to acquire a digital certificate for this process?
              - list [ref=e1590]:
                - listitem [ref=e1591]: It is not necessary.
            - listitem [ref=e1592]:
              - paragraph [ref=e1593]:
                - strong [ref=e1594]: Where can I get support for questions related to my contract, billing, and Verify ID functionalities?
              - list [ref=e1595]:
                - listitem [ref=e1596]: Follow the rules of your contract with Serasa Experian. If you have questions about your contract, request more details from your commercial contact at Serasa Experian or contact our Customer Relationship Center at 3003-7372.
            - listitem [ref=e1597]:
              - paragraph [ref=e1598]:
                - strong [ref=e1599]: How can I get clarifications about this material?
              - list [ref=e1600]:
                - listitem [ref=e1601]:
                  - text: Contact
                  - link "onboardingidf@br.experian.com" [ref=e1602] [cursor=pointer]:
                    - /url: /api/data-verification-for-pf-pj/mailtoonboardingidfbrexperiancom
            - listitem [ref=e1603]:
              - paragraph [ref=e1604]:
                - strong [ref=e1605]: Who do I report problems with queries in the production environment to?
              - list [ref=e1606]:
                - listitem [ref=e1607]: Contact our Customer Relationship Center at 3003-7372.
            - listitem [ref=e1608]:
              - paragraph [ref=e1609]:
                - strong [ref=e1610]: Is it possible to customize the return of some information?
              - list [ref=e1611]:
                - listitem [ref=e1612]: For clarifications on customizations, contact your commercial representative at Serasa Experian or our Customer Relationship Center at 3003-7372.
            - listitem [ref=e1613]:
              - paragraph [ref=e1614]:
                - strong [ref=e1615]: What is the validity period of the test login?
              - list [ref=e1616]:
                - listitem [ref=e1617]: The login is usually created with a validity period of 30 days. If you need to renew it, contact your commercial representative at Serasa Experian or our Customer Relationship Center at 3003-7372.
            - listitem [ref=e1618]:
              - paragraph [ref=e1619]:
                - strong [ref=e1620]: What is the response time?
              - list [ref=e1621]:
                - listitem [ref=e1622]: The application is estimated to respond in less than 500 milliseconds, with a maximum response time of up to 1 second.
            - listitem [ref=e1623]:
              - paragraph [ref=e1624]:
                - strong [ref=e1625]: For status code 451 (Minor, PEP, VIP, OTHERS - Due to LGPD), is the transaction accounted for?
              - list [ref=e1626]:
                - listitem [ref=e1627]: No, the transaction is only accounted for with a success status code.
