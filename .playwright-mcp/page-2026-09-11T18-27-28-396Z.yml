                - cell "VERIFY" [ref=e205]
                - cell "Performs IPC Registration Verification of the submitted data, obtaining corrections or information about the veracity of the items and finally provides the inserted record with authentication." [ref=e206]
                - cell "It will be used in conjunction with the REQUEST parameter. Cannot be used in conjunction with the VERIFY DISTINCT parameter." [ref=e207]
              - row [ref=e208]:
                - cell "VERIFY_DISTINCT" [ref=e209]
                - 'cell "Performs all procedures described for the IPC Registration Verification operation but when it triggers Data Return: Returns only the information that expects some discrepancy in relation to the Serasa Experian database." [ref=e210]'
