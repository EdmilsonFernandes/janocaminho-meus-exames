          - generic [ref=f10e252]:
            - generic [ref=f10e253]:
              - generic [ref=f10e254]:
                - heading "1. Introduction" [level=2] [ref=f10e255]
                - generic [ref=f10e256]:
                  - text: This article is a commentary on the pressing issue of non-medical androgen use by strength athletes who frequent the gym, which has seen a significant rise in recent years (
                  - link "Balk & Melman, 2023" [ref=f10e257] [cursor=pointer]:
                    - /url: "#bib0004"
                  - text: ;
                  - link "Goldman et al., 2018" [ref=f10e259] [cursor=pointer]:
                    - /url: "#bib0013"
                  - text: ). While its primary focus is to address the problem of androgen use, it includes a case report to illustrate the complex interactions between people who use androgens and healthcare professionals. This case report is not central to the article but serves to highlight the real-world challenges faced by both parties.
                - generic [ref=f10e261]:
                  - generic [ref=f10e262]:
                    - generic [ref=f10e263]:
                      - text: To explore potential solutions, the article emphasizes on harm reduction as a strategy. This approach focuses on educating individuals about the
                      - link "side effects" [ref=f10e264] [cursor=pointer]:
                        - /url: /topics/nursing-and-health-professions/side-effect
                      - text: of androgens, promoting more responsible use, and implementing close health monitoring. Harm reduction is not a new methodology, with its implementation in various contexts, including
                    - link "anabolic steroid" [ref=f10e265] [cursor=pointer]:
                      - /url: /topics/nursing-and-health-professions/anabolic-agent
                    - text: use, dating back over 30 years in the United Kingdom and Australia (
                  - link "Bates et al., 2021" [ref=f10e266] [cursor=pointer]:
                    - /url: "#bib0005"
                  - text: ;
                  - link "Gibbs et al., 2022" [ref=f10e268] [cursor=pointer]:
                    - /url: "#bib0012"
                  - text: ). Trying to expand on the existing knowledge, this article outlines the forthcoming HARNAS trial, which will rigorously evaluate the effectiveness of a clinical and longitudinal harm reduction strategy and compare its outcomes with a historical control group. The findings from the HARNAS trial are anticipated to offer valuable insights and contribute to developing best practices for managing androgen use in clinical settings.
              - generic [ref=f10e270]:
                - heading "2. Case report" [level=2] [ref=f10e271]
                - generic [ref=f10e272]:
                  - text: A 43-year-old man consults his general practitioner because he intends to start using non-prescribed androgens at short notice. His use is motivated by a decline in strength due to his increasing age. Some acquaintances have already started using and could supply him with the required androgens and protocols on how to use them. He requests a blood analysis halfway through his cycle with testosterone and
                  - link "nandrolone" [ref=f10e273] [cursor=pointer]:
                    - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/nandrolone
                  - text: to screen for possible health issues. The consulted general practitioner is not very familiar with non-prescribed androgens and is unwilling to perform the analysis as he would not be able to interpret the results accurately. He advises the patient to refrain from starting androgens, but the man is adamant and intends to proceed regardless.
                - generic [ref=f10e274]:
                  - text: Two years later, the man consults the general practitioner again. He has been using androgens continuously for the last two years, alternating high-dose cycles with a relatively low
                  - link "maintenance dose" [ref=f10e275] [cursor=pointer]:
                    - /url: /topics/nursing-and-health-professions/maintenance-drug-dose
                  - generic [ref=f10e276]:
                    - text: . He did not want to quit his use after the first cycle, as he was reluctant to face a decline in the strength that he had accrued. To boost performance even further, he uses growth hormone 4 IU per day and
                    - link "insulin glargine" [ref=f10e277] [cursor=pointer]:
                      - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/insulin-glargine
                    - generic [ref=f10e278]:
                      - generic [ref=f10e279]:
                        - text: 10 IU before bedtime. He has undergone blood tests several times through a private laboratory that does not provide review by a medical professional. The athletic performance coach, who lacks a formal medical education, has reviewed the results of the blood test instead, in order to direct medical advice. His hematocrit has been elevated ever since he started using. His current request is for treatment of his
                        - link "elevated blood pressure" [ref=f10e280] [cursor=pointer]:
                          - /url: /topics/nursing-and-health-professions/elevated-blood-pressure
                        - text: ", which stands at 160/100 mmHg, even when using lower androgen dosages. The general practitioner declines to prescribe"
                      - link "antihypertensive drugs" [ref=f10e281] [cursor=pointer]:
                        - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/antihypertensive-agent
                      - text: and advises the patient to discontinue using androgens instead.
                - generic [ref=f10e282]:
                  - generic [ref=f10e283]:
                    - generic [ref=f10e284]:
                      - text: Five years after his initial consultation, having never stopped androgens in an effort to push his limits even further, the man is admitted to the
                      - link "cardiology" [ref=f10e285] [cursor=pointer]:
                        - /url: /topics/medicine-and-dentistry/cardiology
                      - text: ward with hypertension,
                    - link "left ventricular hypertrophy" [ref=f10e286] [cursor=pointer]:
                      - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/heart-left-ventricle-hypertrophy
                    - text: ", and signs of heart failure. His left ventricular"
                  - link "ejection fraction" [ref=f10e287] [cursor=pointer]:
                    - /url: /topics/nursing-and-health-professions/heart-ejection-fraction
                  - generic [ref=f10e288]:
                    - text: has declined to 30 %. He recently initiated a heavy cycle for an upcoming bodybuilding competition. Despite self-medicating with
                    - link "telmisartan" [ref=f10e289] [cursor=pointer]:
                      - /url: /topics/nursing-and-health-professions/telmisartan
                    - generic [ref=f10e290]:
                      - text: from the black market, his blood pressure remains high. As a result of these events, the patient decides to discontinue cycling with high doses of androgens but intends to continue using testosterone in a lower
                      - link "maintenance dose" [ref=f10e291] [cursor=pointer]:
                        - /url: /topics/medicine-and-dentistry/maintenance-drug-dose
                      - text: .
                - generic [ref=f10e292]:
                  - text: The presented case effectively highlights the intricate and challenging interaction between athletes who use
                  - link "anabolic steroids" [ref=f10e293] [cursor=pointer]:
                    - /url: /topics/medicine-and-dentistry/anabolic-agent
                  - generic [ref=f10e294]:
                    - text: and healthcare professionals. Constrained by a lack of knowledge about androgens, the general practitioner is unable to adequately educate the man about the associated
                    - link "side effects" [ref=f10e295] [cursor=pointer]:
                      - /url: /topics/nursing-and-health-professions/side-effect
                    - text: and risks. Unsupported by guidelines on managing people who use androgens, he declines to assist with health check-ups. When the man presents with hypertension, he sensibly advises discontinuing androgens, though he likely knows this advice may not be heeded.
                - generic [ref=f10e296]:
                  - generic [ref=f10e297]:
                    - text: The patient, a typical determined user of androgens, has made efforts to monitor his health through blood work and
                    - link "blood pressure measurements" [ref=f10e298] [cursor=pointer]:
                      - /url: /topics/nursing-and-health-professions/blood-pressure-measurement
                    - generic [ref=f10e299]:
                      - text: . However, he lacks the ability to accurately interpret the results, anticipate potential consequences on his health, or address emerging
                      - link "side effects" [ref=f10e300] [cursor=pointer]:
                        - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/side-effect
                      - text: adequately. This culmination leads to a serious
                  - link "adverse event" [ref=f10e301] [cursor=pointer]:
                    - /url: /topics/nursing-and-health-professions/adverse-event
                  - text: that may have been prevented with better patient education or side effect management—or had the man never used androgens at all.
                - generic [ref=f10e302]:
                  - heading "2.1. Androgen use and its health effects" [level=3] [ref=f10e303]
                  - generic [ref=f10e304]:
                    - text: Anabolic-androgenic steroids (AAS), or simply androgens, have been used for decades to enhance muscle mass and strength. While androgen use was largely restricted to elite bodybuilders in the 1980s and 1990s, nowadays, its use has become widespread among amateur athletes (
                    - link "Handelsman, 2021" [ref=f10e305] [cursor=pointer]:
                      - /url: "#bib0016"
                    - text: ), i.e., strength athletes not taking part in bodybuilding competitions, and often goes beyond bodybuilding as a means to improve body image. In the Netherlands, the prevalence of androgen use, measured as any use in the last 12 months, has surged from 20,000 in 2009 (
                    - link "Woerdeman et al., 2010" [ref=f10e307] [cursor=pointer]:
                      - /url: "#bib0039"
                    - text: ) to almost half a million in 2023 (
                    - link "Balk & Melman, 2023" [ref=f10e309] [cursor=pointer]:
                      - /url: "#bib0004"
                    - text: ).
                  - generic [ref=f10e311]:
                    - generic [ref=f10e312]:
                      - generic [ref=f10e313]:
                        - generic [ref=f10e314]:
                          - text: The harmful effects of androgen use are increasingly understood. Short-term side effects, including irritability,
                          - link "gynecomastia" [ref=f10e315] [cursor=pointer]:
                            - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/gynecomastia
                          - text: ", and"
                        - link "acne" [ref=f10e316] [cursor=pointer]:
                          - /url: /topics/medicine-and-dentistry/acneiform-eruption
                        - text: during androgen use are well recognized, just as fatigue,
                      - link "loss of libido" [ref=f10e317] [cursor=pointer]:
                        - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/libido-disorder
                      - generic [ref=f10e318]:
                        - text: ", and depressed mood after discontinuation due to temporary"
                        - link "hypogonadism" [ref=f10e319] [cursor=pointer]:
                          - /url: /topics/medicine-and-dentistry/hypogonadism
                        - text: which may be highly variable in people who use androgens (
                    - link "Bond et al., 2022" [ref=f10e320] [cursor=pointer]:
                      - /url: "#bib0008"
                    - text: ;
                    - link "Smit et al., 2022" [ref=f10e322] [cursor=pointer]:
                      - /url: "#bib0033"
                    - text: ;
                    - link "Solanki et al., 2023" [ref=f10e324] [cursor=pointer]:
                      - /url: "#bib0029"
                    - text: ). The severity and the incidence of these adverse effects are less understood, however. The long-term effects on health remain even less clear and are the most important gaps in current knowledge. This notwithstanding, cardiovascular disease and the risk of permanent dysfunction of the hypothalamic-pituitary-gonadal axis are prominent concerns (
                    - link "Baggish et al., 2017" [ref=f10e326] [cursor=pointer]:
                      - /url: "#bib0003"
                    - text: ;
                    - link "Kanayama et al., 2018" [ref=f10e328] [cursor=pointer]:
                      - /url: "#bib0023"
                    - text: ).
                  - generic [ref=f10e330]:
                    - text: Educational programs in many countries have endeavored to inform young athletes about the risks of androgen use and promote "natural" bodybuilding with proper dietary and training regimens and safe performance-enhancing supplements (
                    - link "Hurst et al., 2023" [ref=f10e331] [cursor=pointer]:
                      - /url: "#bib0022"
                    - text: ;
                    - link "Sagoe et al., 2016" [ref=f10e333] [cursor=pointer]:
                      - /url: "#bib0027"
                    - text: ). However, the increasing prevalence of androgen use suggests that this approach may be insufficient, highlighting the urgent need for emphasis on a different approach.
                - generic [ref=f10e335]:
                  - heading "2.2. Harm reduction as a different approach to androgen use" [level=3] [ref=f10e336]
                  - generic [ref=f10e337]:
                    - text: Harm reduction could offer such an approach. It focuses on mitigating the negative consequences of androgen use, assuming that certain athletes will continue to use these substances. The primary goal is not necessarily to compel users to quit androgen use outright–although this would be a welcome collateral effect–but rather to minimize its adverse effects by providing education on more responsible usage and treating emerging side effects. The call for harm reduction as an approach for androgen use is growing, with recent studies emphasizing the need for tailored harm reduction strategies and healthcare professional training (
                    - link "Atkinson et al., 2021" [ref=f10e338] [cursor=pointer]:
                      - /url: "#bib0002"
                    - text: ;
                    - link "Bonnecaze et al., 2021" [ref=f10e340] [cursor=pointer]:
                      - /url: "#bib0009"
                    - text: ;
                    - link "Bates et al., 2019" [ref=f10e342] [cursor=pointer]:
                      - /url: "#bib0006"
                    - text: ","
                    - link "2021" [ref=f10e344] [cursor=pointer]:
                      - /url: "#bib0005"
                    - text: ). This literature highlights the potential benefits of these approaches, such as better engagement with healthcare services and more informed users (
                    - link "Piatkowski et al., 2022" [ref=f10e346] [cursor=pointer]:
                      - /url: "#bib40"
                    - text: ). In addition, reports have showed promising results from general practitioners interacting with their androgen using patients (
                    - link "Eu et al., 2023" [ref=f10e348] [cursor=pointer]:
                      - /url: "#bib0011"
                    - text: ) and e-modules being developed to educate healthcare professionals on how to engage with people who use performance- and image-enhancing drugs (
                    - link "Atkinson et al., 2021" [ref=f10e350] [cursor=pointer]:
                      - /url: "#bib0002"
                    - text: ).
                  - generic [ref=f10e352]:
                    - generic [ref=f10e353]:
                      - text: Controversial as it may be for people who use
                      - link "anabolic steroids" [ref=f10e354] [cursor=pointer]:
                        - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/anabolic-steroid
                      - text: ", the concept of harm reduction is not new in medicine ("
                    - link "Hawk et al., 2017" [ref=f10e355] [cursor=pointer]:
                      - /url: "#bib0017"
                    - text: ). Needle and syringe programs aim to reduce the risk of bloodborne virus transmission among people who inject drugs (
                    - link "van Santen et al., 2021" [ref=f10e357] [cursor=pointer]:
                      - /url: "#bib0028"
                    - text: ;
                    - link "Smye et al., 2011" [ref=f10e359] [cursor=pointer]:
                      - /url: "#bib0037"
                    - generic [ref=f10e361]:
                      - text: ), while
                      - link "methadone maintenance" [ref=f10e362] [cursor=pointer]:
                        - /url: /topics/nursing-and-health-professions/methadone-treatment
                      - generic [ref=f10e363]:
                        - text: therapy helps manage
                        - link "opioid dependence" [ref=f10e364] [cursor=pointer]:
                          - /url: /topics/medicine-and-dentistry/opioid-dependence
                        - text: . Testing recreational drugs at festivals to prevent accidental overdoses is another example of effective harm reduction (
                    - link "Palamar et al., 2021" [ref=f10e365] [cursor=pointer]:
                      - /url: "#bib0026"
                    - text: ). Supervised injection facilities provide a safe environment for drug use, reducing the risk of overdose and infection (
                    - link "Levengood et al., 2021" [ref=f10e367] [cursor=pointer]:
                      - /url: "#bib0025"
                    - generic [ref=f10e369]:
                      - text: ). Additionally, distributing
                      - link "naloxone" [ref=f10e370] [cursor=pointer]:
                        - /url: /topics/medicine-and-dentistry/naloxone
                      - text: kits to opioid users and their families helps to prevent fatal overdoses (
                    - link "Chimbar & Moleta, 2018" [ref=f10e371] [cursor=pointer]:
                      - /url: "#bib0010"
                    - generic [ref=f10e373]:
                      - generic [ref=f10e374]:
                        - text: ). To some degree, treating
                        - link "liver cirrhosis" [ref=f10e375] [cursor=pointer]:
                          - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/liver-cirrhosis
                        - generic [ref=f10e376]:
                          - text: in patients who keep drinking alcohol, treating
                          - link "pulmonary disease" [ref=f10e377] [cursor=pointer]:
                            - /url: /topics/medicine-and-dentistry/silo-fillers-disease
                          - text: in patients who continue smoking and treating insulin resistance in
                      - link "sedentary patients" [ref=f10e378] [cursor=pointer]:
                        - /url: /topics/nursing-and-health-professions/sedentary-patient
                      - text: could be regarded as harm reduction.
                  - generic [ref=f10e379]:
                    - link "Hawk et al. (2017)" [ref=f10e380] [cursor=pointer]:
                      - /url: "#bib0017"
                    - generic [ref=f10e382]:
                      - text: "define six key harm reduction principles that emphasize: humanism, pragmatism, individualism, autonomy, incrementalism, and accountability without termination. These principles guide healthcare providers to treat patients with respect, understand their unique circumstances, support their autonomy, encourage gradual positive changes, and maintain ongoing engagement without moral judgment. In applying these principles to the case study, the healthcare provider should have respected the patient's decision to use androgens, offered safer usage guidelines, and provided regular health monitoring. Building a trusting relationship through non-judgmental communication and comprehensive risk education, the provider could have encouraged safer practices, such as shorter cycles or"
                      - link "lower doses" [ref=f10e383] [cursor=pointer]:
                        - /url: /topics/nursing-and-health-professions/low-drug-dose
                      - text: ", while ensuring continuous support and care."
                - generic [ref=f10e384]:
                  - heading "2.3. Development of our harm reduction strategy" [level=3] [ref=f10e385]
                  - generic [ref=f10e386]:
                    - generic [ref=f10e387]:
                      - text: In the Netherlands, two hospitals have
                      - link "outpatient clinics" [ref=f10e388] [cursor=pointer]:
                        - /url: /topics/nursing-and-health-professions/outpatient-department
                      - text: for people who used androgens in the past and who still experience symptoms related to this use (
                    - link "Smit & De Ronde, 2018" [ref=f10e389] [cursor=pointer]:
                      - /url: "#bib0035"
                    - text: ). Additionally, the HAARLEM study (Health risks of Anabolic Androgenic steroid use in maLE aMateur athletes) has provided valuable prospective observational data on the short-term health effects of androgen use and opportunities to engage with users (
                    - link "Smit et al., 2022" [ref=f10e391] [cursor=pointer]:
                      - /url: "#bib0030"
                    - text: ). The accumulated clinical experience from both the clinic and the study has led to a vast understanding of real-world androgen use and a couple of interesting observations.
                  - generic [ref=f10e393]:
                    - generic [ref=f10e394]:
                      - generic [ref=f10e395]:
                        - text: First, men who use androgens adhere to certain fundamental principles. These include alternating cycles with high dosages of androgens followed by periods of no use (intermittent cycling) or alternating high-dose cycles with a lower maintenance dose of testosterone (blast-and-cruise), the use of medication to limit side effects such as
                        - link "gynecomastia" [ref=f10e396] [cursor=pointer]:
                          - /url: /topics/medicine-and-dentistry/gynecomastia
                        - text: ", and the routine practice of performing post-cycle therapy (PCT). PCT involves using substances like"
                      - link "selective estrogen receptor modulators" [ref=f10e397] [cursor=pointer]:
                        - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/selective-estrogen-receptor-modulator
                      - text: (SERMs) to purportedly expedite recovery of the hypothalamic-pituitary-gonadal axis (
                    - link "Griffiths et al., 2017" [ref=f10e398] [cursor=pointer]:
                      - /url: "#bib0015"
                    - text: ). However, beyond these principles, cycles vary widely in terms of the compounds used and dosing regimens. Many men initially start their cycles with a specific plan in mind but quickly deviate, often opting for longer cycles with higher dosages (
                    - link "Smit et al., 2020" [ref=f10e400] [cursor=pointer]:
                      - /url: "#bib0034"
                    - text: ). This improvisation and escalation in androgen use is particularly concerning as it further exacerbates the detrimental effects on health and narrows the opportunity to quit use in the future.
                  - generic [ref=f10e402]:
                    - text: Second, athletes invest significant time in researching androgens, primarily online (
                    - link "Harvey et al., 2019" [ref=f10e403] [cursor=pointer]:
                      - /url: "#bib0018"
                    - generic [ref=f10e405]:
                      - text: ). Although they may possess a rudimentary understanding of the basic
                      - link "endocrinology" [ref=f10e406] [cursor=pointer]:
                        - /url: /topics/medicine-and-dentistry/endocrinology
                      - generic [ref=f10e407]:
                        - generic [ref=f10e408]:
                          - text: of androgen use, misconceptions are prevalent, and many knowledge gaps persist—especially regarding cardiovascular and hormonal issues. These misconceptions often lead to underestimation of health risks and, similarly, overestimation of how one can mitigate these risks. Moreover, much of the information, both accurate and inaccurate, is sourced from blogs, forums, anecdotes, or personal social networks, sometimes causing individuals to lose perspective on what is considered 'normal'. For instance, a user may perceive a weekly dose of 300 mg of a
                          - link "testosterone ester" [ref=f10e409] [cursor=pointer]:
                            - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/testosterone-ester
                          - generic [ref=f10e410]:
                            - text: as a standard maintenance dose (akin to 'testosterone replacement therapy', or TRT) simply because their peers do the same, despite medical TRT generally being dosed roughly between 75 and 100 mg per week. In this regard, it is important to differentiate between testosterone esters and testosterone. Testosterone esters, such as
                            - link "testosterone enanthate" [ref=f10e411] [cursor=pointer]:
                              - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/testosterone-enantate
                            - text: or cypionate, are injectable
                        - link "prodrugs" [ref=f10e412] [cursor=pointer]:
                          - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/prodrug
                        - text: of testosterone that release the hormone slowly into the bloodstream, requiring less frequent dosing. In contrast, testosterone gel is applied daily, delivering a consistent amount of testosterone through the skin but with low (∼10 %) bioavailability, such that the usual dose is about 50 mg per day.
                  - generic [ref=f10e413]: Thirdly, people who use androgens tend to defer to individuals with expertise in androgens, preferably those with a reputable status—a 'guru'. They consume their content through ‘debunks’, podcasts, and social media feeds, allowing their use of androgens to be influenced by such content. Particularly ardent athletes often seek guidance from bodybuilding coaches who are remunerated to provide advice on lifestyle, diet, training, androgen use, and androgen-related health problems. Likewise, the internists-endocrinologists from the aforementioned outpatient clinics have garnered significant recognition over time, and their advice is typically regarded with seriousness.
                  - generic [ref=f10e414]:
                    - generic [ref=f10e415]:
                      - text: These observations could inform a harm reduction strategy, wherein counseling aims to educate users about the risks of androgen use using reliable and evidence-based information. The strategy would also advocate for more responsible (i.e., less excessive), cycle protocols, discouraging improvisation and escalating use, thereby limiting the time spent performing cycles. Additionally, medical investigations such as blood tests could be conducted to enhance adherence to the strategy, to provide insight into deleterious effects of androgens on
                      - link "health status" [ref=f10e416] [cursor=pointer]:
                        - /url: /topics/nursing-and-health-professions/health-status
                      - text: ", and to detect potential health damage at an early stage. It is anticipated that users would heed these advices if provided by a knowledgeable and preferably reputable health professional ("
                    - link "Havnes et al., 2019" [ref=f10e417] [cursor=pointer]:
                      - /url: "#bib0019"
                    - text: ).
                - generic [ref=f10e419]:
                  - heading "2.4. Details of the harm reduction strategy" [level=3] [ref=f10e420]
                  - generic [ref=f10e421]: The initial consultation holds paramount importance in the harm reduction strategy. It is imperative for the healthcare professional to adopt an unbiased approach, demonstrating genuine interest in the athlete and showcasing expertise on androgens to build trust. The athlete should feel at ease discussing bodybuilding and performance enhancement without fear of judgment and should establish a strong interpersonal rapport with the counseling physician.
                  - generic [ref=f10e422]:
                    - generic [ref=f10e423]:
                      - text: During this pivotal meeting, the healthcare professional delves into the goals of the athlete and assesses their feasibility, with or without the use of androgens. Alternative avenues to fulfill the ambitions of the athlete are explored. Emphasis is placed on finding shortcomings in diet, sleep, training, and stress levels, which could otherwise contribute to improved physical performance and may reduce the desire to resort to androgen use. Additionally, the presence of addiction and body dysmorphia is explored and addressed. A significant portion of time is dedicated to educating athletes about the health risks associated with androgen use, considering the
                      - link "health status" [ref=f10e424] [cursor=pointer]:
                        - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/health-status
                      - text: and family history of the athlete. The health risks discussed encompassing physical and psychological side effects, potential long-term
                    - link "endocrine dysfunction" [ref=f10e425] [cursor=pointer]:
                      - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/endocrine-disease
                    - text: ", and cardiovascular disease."
                  - generic [ref=f10e426]:
                    - text: "If the athlete remains adamant to use androgens after providing comprehensive information, the healthcare professional advocates for a more responsible approach to using androgens. This includes several key aspects:"
                    - list [ref=f10e427]:
                      - listitem [ref=f10e428]:
                        - generic [ref=f10e429]: •
                        - generic [ref=f10e431]:
                          - generic [ref=f10e432]:
                            - generic [ref=f10e433]:
                              - text: "Cycle duration: Ideally, cycles should last between 8 and 10, at most 12 weeks. Prolonged cycles increase the risk of side effects, particularly concerning the heart, such as"
                              - link "left ventricular hypertrophy" [ref=f10e434] [cursor=pointer]:
                                - /url: /topics/nursing-and-health-professions/heart-left-ventricle-hypertrophy
                              - text: and diminished
                            - link "ejection fraction" [ref=f10e435] [cursor=pointer]:
                              - /url: /topics/medicine-and-dentistry/ejection-fraction
                            - text: (
                          - link "Smit et al., 2021c" [ref=f10e436] [cursor=pointer]:
                            - /url: "#bib0036"
                          - text: ). In addition, short cycles are believed to result in less severe withdrawal symptoms (
                          - link "Grant et al., 2023" [ref=f10e438] [cursor=pointer]:
                            - /url: "#bib0014"
                          - text: ), facilitating the retention of accrued body mass post-cycle.
                      - listitem [ref=f10e440]:
                        - generic [ref=f10e441]: •
                        - generic [ref=f10e443]:
                          - text: "Type of compounds: Injectable testosterone esters are preferred, as other androgen types are less well-studied and non-testosterone products obtained from the black market are often unreliable in terms of active ingredients ("
                          - link "Smit et al., 2020" [ref=f10e444] [cursor=pointer]:
                            - /url: "#bib0034"
                          - generic [ref=f10e446]:
                            - generic [ref=f10e447]:
                              - text: ). Oral
                              - link "anabolic steroids" [ref=f10e448] [cursor=pointer]:
                                - /url: /topics/nursing-and-health-professions/anabolic-agent
                              - text: in particular should be avoided due to their greater
                            - link "hepatotoxicity" [ref=f10e449] [cursor=pointer]:
                              - /url: /topics/medicine-and-dentistry/liver-toxicity
                            - text: and disturbance of lipid profiles (
                          - link "Smit et al., 2021c" [ref=f10e450] [cursor=pointer]:
                            - /url: "#bib0036"
                          - text: ;
                          - link "Bond et al., 2016" [ref=f10e452] [cursor=pointer]:
                            - /url: "#bib0007"
                          - text: ","
                          - link "2022" [ref=f10e454] [cursor=pointer]:
                            - /url: "#bib0008"
                          - text: ;).
                      - listitem [ref=f10e456]:
                        - generic [ref=f10e457]: •
                        - generic [ref=f10e459]:
                          - text: "Cycle dose: Weekly cumulative androgen doses should range between 250 and 750 mg, certainly not exceeding 1000 mg. Higher doses yield diminishing returns in terms of gains in muscle mass and strength, and increase the risk of side effects, particularly cardiovascular issues ("
                          - link "Smit et al., 2021c" [ref=f10e460] [cursor=pointer]:
                            - /url: "#bib0036"
                          - text: ).
                      - listitem [ref=f10e462]:
                        - generic [ref=f10e463]: •
                        - generic [ref=f10e465]:
                          - text: "Recovery period: A strong preference is given to discontinuing all androgens after a cycle, rather than adopting a blast-and-cruise protocol. Recovery time should be at least three months, as this is typically the duration required for full recovery ("
                          - link "Smit et al., 2021b" [ref=f10e466] [cursor=pointer]:
                            - /url: "#bib0032"
                          - generic [ref=f10e468]:
                            - text: ). Recovery time should ideally be twice the duration of the cycle, to limit androgen exposure. If an athlete persists in performing TRT between cycles (‘bridging’ or ‘cruising’), a weekly maintenance dose of 100–125 mg
                            - link "testosterone enanthate" [ref=f10e469] [cursor=pointer]:
                              - /url: /topics/medicine-and-dentistry/testosterone-enantate
                            - text: or cypionate is recommended.
                      - listitem [ref=f10e470]:
                        - generic [ref=f10e471]: •
                        - generic [ref=f10e473]:
                          - generic [ref=f10e474]:
                            - generic [ref=f10e475]:
                              - text: "Other performance and image-enhancing drugs: Adding additional drugs like growth hormone and insulin to anabolic steroid regimens offers minimal benefits but poses significant health risks, including"
                              - link "arthropathy" [ref=f10e476] [cursor=pointer]:
                                - /url: /topics/medicine-and-dentistry/arthropathy
                              - generic [ref=f10e477]:
                                - text: and
                                - link "cardiomyopathy" [ref=f10e478] [cursor=pointer]:
                                  - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/cardiomyopathy
                                - text: with growth hormone, and hypoglycemia and
                            - link "metabolic liver disease" [ref=f10e479] [cursor=pointer]:
                              - /url: /topics/medicine-and-dentistry/metabolic-liver-disease
                            - text: with insulin abuse (
                          - link "Holt et al., 2008" [ref=f10e480] [cursor=pointer]:
                            - /url: "#bib0021"
                          - text: ).
                  - generic [ref=f10e482]:
                    - generic [ref=f10e483]:
                      - generic [ref=f10e484]:
                        - generic [ref=f10e485]:
                          - generic [ref=f10e486]:
                            - text: Medical investigations conducted after the initial intake session and during follow-up sessions, both during and after cycles, include
                            - link "blood pressure measurements" [ref=f10e487] [cursor=pointer]:
                              - /url: /topics/medicine-and-dentistry/blood-pressure-measurement
                            - text: ", blood and"
                          - link "urine analysis" [ref=f10e488] [cursor=pointer]:
                            - /url: /topics/nursing-and-health-professions/urinalysis
                          - text: ", and electrocardiography to screen for"
                        - link "arrhythmia" [ref=f10e489] [cursor=pointer]:
                          - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/heart-arrhythmia
                        - text: and
                      - link "left ventricular hypertrophy" [ref=f10e490] [cursor=pointer]:
                        - /url: /topics/medicine-and-dentistry/left-ventricular-hypertrophy
                      - generic [ref=f10e491]:
                        - text: . Ideally,
                        - link "echocardiography" [ref=f10e492] [cursor=pointer]:
                          - /url: /topics/medicine-and-dentistry/echocardiography
                        - text: would have been included in the investigations as well to screen cardiac health more meticulously (
                    - link "Abdullah et al., 2024" [ref=f10e493] [cursor=pointer]:
                      - /url: "#bib0001"
                    - text: ;
                    - link "Henriksen et al., 2023" [ref=f10e495] [cursor=pointer]:
                      - /url: "#bib0020"
                    - generic [ref=f10e497]:
                      - generic [ref=f10e498]:
                        - text: ), but this was too cost-prohibitive for this study to perform routinely. Blood tests encompass a blood count, liver panel, kidney function, and cholesterol profile to detect
                        - link "erythrocytosis" [ref=f10e499] [cursor=pointer]:
                          - /url: /topics/nursing-and-health-professions/erythrocytosis
                        - text: ","
                      - link "hepatotoxicity" [ref=f10e500] [cursor=pointer]:
                        - /url: /topics/nursing-and-health-professions/liver-toxicity
                      - generic [ref=f10e501]:
                        - text: ", decreased kidney function, and"
                        - link "dyslipidemia" [ref=f10e502] [cursor=pointer]:
                          - /url: /topics/medicine-and-dentistry/dyslipidemia
                        - generic [ref=f10e503]:
                          - text: ", respectively. Urine tests are primarily for detecting"
                          - link "proteinuria" [ref=f10e504] [cursor=pointer]:
                            - /url: /topics/medicine-and-dentistry/proteinuria
                          - text: . Testosterone concentrations are only measured when androgens are not being used to confirm hormonal recovery. Results are interpreted collaboratively with the athlete and utilized to discuss the potential health impacts with them. Any abnormalities detected before or between cycles should prompt athletes to postpone androgen use, while abnormalities detected during cycles can serve as motivation to adhere to the original cycle plan or discontinue the cycle in case of serious issues.
                - generic [ref=f10e505]:
                  - heading "2.5. Caveats with this approach" [level=3] [ref=f10e506]
                  - generic [ref=f10e507]:
                    - text: Despite the thoughtfulness and innovation of the presented harm reduction strategy, it is not without its objections. If medical doctors or other health care providers would treat individuals who use androgens, this could be seen as tacitly condoning their unhealthy lifestyle choices. This is certainly an objection in many European countries, including the Netherlands. However, a fundamental principle of harm reduction is providing healthcare without the requirement for cessation of drug use. This approach respects the autonomy of individuals and focuses on minimizing health risks and negative outcomes. While primary prevention and cessation are important goals, harm reduction offers a pragmatic strategy to engage individuals who might not be ready or willing to stop using androgens immediately. Additionally, legislative barriers regarding anabolic steroids may present challenges. It could be difficult for
                    - link "healthcare facilities" [ref=f10e508] [cursor=pointer]:
                      - /url: /topics/nursing-and-health-professions/health-care-facility
                    - text: to offer harm reduction methods in countries where the use of anabolic steroids is prohibited. Authorities may not endorse such clinics, and even if they did, athletes might be hesitant to openly discuss and admit their use.
                  - generic [ref=f10e509]: Arguably, the most significant drawback of offering harm reduction is its potential for enabling androgen use. In essence, individuals who were considering androgen use might feel emboldened to start a cycle simply because a healthcare professional is monitoring their health. If many athletes were to commence using anabolic steroids due to this strategy, it could negate its intended health benefits entirely, rendering the effort futile or even counterproductive. The extent of this enabling effect, if present, cannot be determined until empirical or real-world data becomes available.
                  - generic [ref=f10e510]:
                    - text: Additionally, harm reduction for androgen abuse is not widely taught to doctors and healthcare professionals, necessitating specific training to effectively engage in this practice (
                    - link "Atkinson et al., 2021" [ref=f10e511] [cursor=pointer]:
                      - /url: "#bib0002"
                    - text: ). Harm reduction provided by healthcare institutions would then have to compete with the widespread lay harm reduction advice and efforts often disseminated online or through social supply channels (
                    - link "Kimergård & McVeigh, 2014" [ref=f10e513] [cursor=pointer]:
                      - /url: "#bib0024"
                    - text: ). Engaging androgen abusers with public services that provide harm reduction is challenging, as users may not believe that physicians understand their specific needs and goals in bodybuilding (
                    - link "Henriksen et al., 2023" [ref=f10e515] [cursor=pointer]:
                      - /url: "#bib0020"
                    - text: ). This challenge is compounded when the advice provided by professionals is perceived as inconsistent with the users' objectives.
                - generic [ref=f10e517]:
                  - heading "2.6. The HARNAS trial" [level=3] [ref=f10e518]
                  - generic [ref=f10e519]: A harm reduction strategy, if implemented by qualified experts, holds promise for effectiveness. However, its efficacy remains uncertain, and like any new treatment, it requires validation through clinical experimentation. The HARNAS trial (HArm Reduction in aNAbolic Steroid use) compares the harm reduction strategy outlined above with a historical control group, the HAARLEM study, which was purely observational. Both studies will involve 100 men with nearly identical inclusion and exclusion criteria to ensure maximum comparability. The follow-up period for both studies is one year. In addition to testing the harm reduction strategy, participants in the HARNAS trial are randomly assigned to a consultation session with a renowned natural strength athlete to explore potential improvements in muscle mass and strength using conventional methods like diet and training regimen enhancements.
                  - generic [ref=f10e520]:
                    - text: The primary outcome measure of the trial is the difference in cycle duration between the intervention and control groups. Cycle duration has been chosen to be the most pivotal parameter as it seems that duration of androgen exposure contributes more to cardiovascular risk than does dose (
                    - link "Smit et al., 2022" [ref=f10e521] [cursor=pointer]:
                      - /url: "#bib0033"
                    - text: ). Secondary outcome measures include the weekly cycle dose, cumulative cycle dose, cumulative androgen exposure during the follow-up year, the number of compounds used in the cycle, and the use of growth hormone. The potential enabling effect of the harm reduction intervention is assessed by tracking the number of new users of anabolic steroids at baseline and through questionnaires.
                  - generic [ref=f10e523]:
                    - text: The trial has received approval from the local
                    - link "medical ethics" [ref=f10e524] [cursor=pointer]:
                      - /url: /topics/medicine-and-dentistry/medical-ethics
                    - text: committee and is currently concluding data collection. Interim analyses have been conducted to allow for preliminary termination of the trial if no harm reduction effect is perceived or if the enabling effect proves to be too significant. These analyses have already shown promising results. The final reports and their implications for future research and clinical practice will be published in the coming years.
                - generic [ref=f10e525]:
                  - heading "2.7. Future horizons" [level=3] [ref=f10e526]
                  - generic [ref=f10e527]:
                    - generic [ref=f10e528]:
                      - text: Not included in the outlined harm reduction strategy is the management of emergent side effects, notably hypertension,
                      - link "dyslipidemia" [ref=f10e529] [cursor=pointer]:
                        - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/dyslipidemia
                      - generic [ref=f10e530]:
                        - text: ", and"
                        - link "erythrocytosis" [ref=f10e531] [cursor=pointer]:
                          - /url: /topics/medicine-and-dentistry/erythrocytosis
                        - text: . These conditions could be ameliorated through the prescription of antihypertensives, cholesterol-lowering agents, and
                    - link "phlebotomy" [ref=f10e532] [cursor=pointer]:
                      - /url: /topics/nursing-and-health-professions/phlebotomy
                    - generic [ref=f10e533]:
                      - text: ", respectively. Given that cardiovascular disease stands as the foremost concern for long-term morbidity, addressing these complications in accordance with contemporary best practices for non-androgen users might facilitate the attenuation of cardiovascular risks alongside the advocacy for more conscientious androgen utilization. For now, future investigations should primarily delve into the underlying mechanisms of these adverse effects, such as elucidating the primary drivers of hypertension—whether stemming predominantly from water and salt retention, heightened sympathetic tone, or dysregulation of the renin-angiotensin system. Subsequently, interventional trials ought to elucidate the most efficacious approaches for each side effect, delineating the optimal pharmacotherapeutic interventions in the context of androgen use and establishing an appropriate"
                      - link "phlebotomy" [ref=f10e534] [cursor=pointer]:
                        - /url: /topics/medicine-and-dentistry/phlebotomy
                      - text: regimen. Moreover, it is imperative to ascertain whether cardiovascular complications should be managed on an individualized basis, contingent upon observed health outcomes in a given patient and/or the duration of androgen misuse, or if standardized medications and procedures should be universally offered to all users.
              - generic [ref=f10e535]:
                - heading "3. Concluding remarks" [level=2] [ref=f10e536]
                - generic [ref=f10e537]: The presented case, alongside the rapidly increasing prevalence of androgen use, underscores the urgent call for proactive measures, such as harm reduction, to mitigate the health repercussions of anabolic steroid use. Healthcare professionals can play a pivotal role in addressing this issue by emphasizing education, more responsible usage, and health monitoring. Despite obstacles like concerns about enabling and legislative barriers, the ongoing HARNAS trial provides optimism for assessing the efficacy of an innovative harm reduction strategy. In the end, new efforts are essential to advocate for safer practices and protect the well-being of individuals engaged in performance-enhancing drug use.
