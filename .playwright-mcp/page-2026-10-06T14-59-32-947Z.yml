        - generic [ref=f10e222]:
          - generic [ref=f10e224]:
            - heading "Abstract" [level=2] [ref=f10e225]
            - generic [ref=f10e227]:
              - text: Non-medical androgen use is on the rise, with short-term
              - link "side effects" [ref=f10e228] [cursor=pointer]:
                - /url: /topics/nursing-and-health-professions/side-effect
              - generic [ref=f10e229]:
                - text: being well-documented whereas long-term consequences remain less understood but are likely to entail cardiovascular illness and permanent endocrine disruptions. Current educational initiatives are falling short in curbing this significant increase, signaling the need for a different approach. In this context, harm reduction emerges as a promising secondary prevention strategy. The key principles of the harm reduction approach outlined in this article emphasize educating individuals about
                - link "side effects" [ref=f10e230] [cursor=pointer]:
                  - /url: /topics/pharmacology-toxicology-and-pharmaceutical-science/side-effect
                - text: ", limiting androgen use, and monitoring health closely. Successful implementation of this strategy hinges upon healthcare providers possessing expertise in the field, fostering non-judgmental interpersonal relationships, and securing cooperation of the athlete. The efficacy of this strategy will be rigorously evaluated in the HARNAS trial, comparing its outcomes with those of a historical control group. The findings from this trial are anticipated to be published in the coming years, shedding light on the effectiveness of this pioneering approach."
          - generic [ref=f10e233]:
            - heading "Keywords" [level=2] [ref=f10e234]
            - generic [ref=f10e235]: Anabolic steroids
            - text: ;
            - generic [ref=f10e236]: Androgen use
            - text: ;
            - generic [ref=f10e237]: Harm reduction
            - text: ;
            - generic [ref=f10e238]: Body building
          - list [ref=f10e239]:
            - listitem [ref=f10e240]:
              - link "Previous article in this issue" [ref=f10e241] [cursor=pointer]:
                - /url: /science/article/pii/S2211266924000495
            - listitem [ref=f10e246]:
