      - text: ", respeitando as formatações indicadas no formulário e revisando as informações antes do envio. As respostas serão analisadas para verificar a aderência do perfil da empresa às necessidades atuais ou futuras da companhia e aos processos de concorrências em andamento. Caso o perfil do fornecedor esteja alinhado ao que buscamos, ele poderá ser convidado a seguir para as próximas etapas do processo. Após o envio do formulário, pedimos que"
      - strong [ref=e34]: aguarde nosso contato
      - text: ", caso seja necessário avançar com as próximas etapas. Se desejar conhecer mais detalhes sobre o processo de avaliação e cadastro de fornecedores, acesse nossa página:"
