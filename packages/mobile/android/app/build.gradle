apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.janocaminho.drexame"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.janocaminho.drexame"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 575
        versionName "2.7.325"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Lê credenciais de app/keystore.properties (NAO commitado — gitignored).
            // Sem o arquivo (clone limpo), release fica sem assinatura (não quebra o build).
            def props = new Properties()
            def propsFile = rootProject.file('app/keystore.properties')
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 ON (score "Otimização do app" do Play: Ofuscação estava 1% com minify off).
            // As keep rules obrigatórias do Capacitor estão em proguard-rules.pro — a chamada
            // JS→nativo é REFLEXIVA (Bridge acha plugin/método por nome); sem elas, push,
            // biometria, Health Connect e Google login quebram SILENCIOSAMENTE em runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.0.0'
    // Health Connect (passos/calorias/distância) — bridge Kotlin window.DxHealth
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    // INCIDENTE 31/10: AAB 559 saiu de um worktree SEM google-services.json (arquivo
    // não-versionado) e o plugin era pulado em SILÊNCIO — app crashava em runtime com
    // "Default FirebaseApp is not initialized" (Sentry). Nunca mais gerar release mudo:
    // sem Firebase config, bundleRelease FALHA na cara (debug segue permitido).
    if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('releas') }) {
        throw new GradleException("google-services.json AUSENTE — AAB de release nasceria sem Firebase (crash 'FirebaseApp is not initialized' no push). Copie o arquivo do clone principal ou build na árvore principal. (incidente AAB 559, 31/10)")
    }
    logger.warn("google-services.json not found — BUILD DEBUG sem push (release é bloqueado).")
}

// ── GATE ANTI-ÁRVORE-SUJA (incidente AAB 563, 04/11/26) ──────────────────────────
// O AAB empacota a WORKING TREE (não o git): o 563 saiu com WIP não-commitado pela
// metade e o Google reprovou. Release SÓ de árvore limpa de código.
// Config-cache-safe: nada de objetos do script dentro do doLast (rootDir/gradle/
// project) — só File relativo ao CWD (packages/mobile/android), git e System.getenv.
// Bypass p/ testes: AAB_ALLOW_DIRTY=1 ./gradlew bundleRelease
tasks.register('gateCleanTree') {
    doLast {
        def dirty = ["git", "status", "--porcelain", "--",
                     "packages/web/src", "packages/server/src", "packages/shared/src",
                     "packages/web/package.json", "packages/server/package.json",
                     "packages/shared/package.json", "packages/mobile/android/app/src"].execute(null, new File("../../../..")).text.readLines().findAll { it.trim() }
        if (dirty && !System.getenv("AAB_ALLOW_DIRTY")) {
            println "=================================================================="
            println " AAB COM ÁRVORE SUJA — RELEASE BLOQUEADO (incidente 563)"
            println "=================================================================="
            dirty.each { println "  • ${it}" }
            println "Commit/push (ou stash) antes de gerar release. Bypass consciente:"
            println "  AAB_ALLOW_DIRTY=1 ./gradlew bundleRelease"
            throw new GradleException("Árvore com código não-commitado — release bloqueado (gate 563).")
        }
        if (dirty) {
            println "[gate563] AVISO: seguindo com árvore suja (bypass AAB_ALLOW_DIRTY) — ${dirty.size()} caminho(s):"
            dirty.each { println "  • ${it}" }
        } else {
            println "[gate563] árvore limpa OK"
        }
    }
}
tasks.matching { it.name in ['bundleRelease', 'assembleRelease'] }.configureEach {
    dependsOn 'gateCleanTree'
}
